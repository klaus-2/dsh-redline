<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 700" font-family="Segoe UI, system-ui, sans-serif" role="img" aria-label="Redline tour: pick an element, comment or adjust live, card at the composer, agent applies the change">
  <defs>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="990" height="700" fill="#0b0d10"/>

  <g>
    <rect x="30" y="40" width="460" height="280" rx="10" fill="#0d0d10" stroke="#262b31"/>
    <rect x="30" y="40" width="460" height="20" rx="10" fill="#16181d"/>
    <circle cx="46" cy="50" r="3.5" fill="#ef4444"/><circle cx="58" cy="50" r="3.5" fill="#f59e0b"/><circle cx="70" cy="50" r="3.5" fill="#22c55e"/>
    <rect x="90" y="46" width="200" height="9" rx="4.5" fill="#1f242b"/>
    <text x="260" y="102" text-anchor="middle" fill="#e5e7eb" font-size="14" font-weight="600">Pronta</text>
    <circle cx="260" cy="160" r="36" fill="none" stroke="#33383f" stroke-width="6"/>
    <circle cx="260" cy="160" r="36" fill="none" stroke="#e5484d" stroke-width="6" stroke-dasharray="150 76" stroke-linecap="round" transform="rotate(-90 260 160)"/>
    <text x="260" y="167" text-anchor="middle" fill="#f3f4f6" font-size="21" font-weight="300">10:00</text>
    <rect x="185" y="104" width="150" height="112" rx="8" fill="#e5484d" fill-opacity="0.07" stroke="#e5484d" stroke-width="2">
      <animate attributeName="fill-opacity" values="0.04;0.12;0.04" dur="2.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="185" y="94" width="34" height="17" rx="5" fill="#f59e0b"/>
    <text x="190" y="106" fill="#111" font-size="9.5" font-weight="700">div</text>
    <rect x="185" y="238" width="72" height="26" rx="7" fill="#ea580c"/>
    <text x="221" y="255" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">Iniciar</text>
    <rect x="263" y="238" width="72" height="26" rx="7" fill="#1f242b" stroke="#33383f"/>
    <text x="299" y="255" text-anchor="middle" fill="#9ca3af" font-size="11">Reiniciar</text>
    <rect x="343" y="238" width="42" height="26" rx="7" fill="#1f242b" stroke="#33383f"/>
    <text x="364" y="255" text-anchor="middle" fill="#9ca3af" font-size="10">5 min</text>
    <rect x="389" y="238" width="46" height="26" rx="7" fill="#2a2f36"/>
    <text x="412" y="255" text-anchor="middle" fill="#e5e7eb" font-size="10">10 min</text>
    <rect x="439" y="238" width="42" height="26" rx="7" fill="#1f242b" stroke="#33383f"/>
    <text x="460" y="255" text-anchor="middle" fill="#9ca3af" font-size="10">20 min</text>
    <text x="170" y="288" text-anchor="middle" fill="#f3f4f6" font-size="15" font-weight="600">0</text>
    <text x="170" y="300" text-anchor="middle" fill="#6b7280" font-size="8">sessões hoje</text>
    <text x="260" y="288" text-anchor="middle" fill="#f3f4f6" font-size="15" font-weight="600">0</text>
    <text x="260" y="300" text-anchor="middle" fill="#6b7280" font-size="8">minutos focados</text>
    <text x="350" y="288" text-anchor="middle" fill="#f3f4f6" font-size="15" font-weight="600">0</text>
    <text x="350" y="300" text-anchor="middle" fill="#6b7280" font-size="8">ciclos de respiração</text>
    <g filter="url(#soft)">
      <rect x="150" y="290" width="220" height="22" rx="11" fill="#101214" stroke="#2a2f36"/>
      <circle cx="164" cy="301" r="3.5" fill="#22c55e"/>
      <line x1="174" y1="293" x2="174" y2="309" stroke="#2a2f36"/>
      <text x="182" y="305" fill="#d1d5db" font-size="9.5">Comentar</text>
      <rect x="222" y="295" width="13" height="12" rx="3" fill="none" stroke="#6b7280"/>
      <text x="228.5" y="304.5" text-anchor="middle" fill="#9ca3af" font-size="7.5">C</text>
      <text x="248" y="305" fill="#d1d5db" font-size="9.5">Ajustar</text>
      <rect x="286" y="295" width="13" height="12" rx="3" fill="none" stroke="#6b7280"/>
      <text x="292.5" y="304.5" text-anchor="middle" fill="#9ca3af" font-size="7.5">V</text>
      <circle cx="352" cy="301" r="6" fill="none" stroke="#6b7280"/>
    </g>
  </g>
  <text x="260" y="344" text-anchor="middle" fill="#9ca3af" font-size="12">1 · Pick an element <tspan fill="#6b7280">— C comment · V adjust</tspan></text>

  <g>
    <rect x="510" y="40" width="460" height="280" rx="10" fill="#0d0d10" stroke="#262b31"/>
    <rect x="510" y="40" width="460" height="20" rx="10" fill="#16181d"/>
    <circle cx="526" cy="50" r="3.5" fill="#ef4444"/><circle cx="538" cy="50" r="3.5" fill="#f59e0b"/><circle cx="550" cy="50" r="3.5" fill="#22c55e"/>
    <rect x="570" y="46" width="200" height="9" rx="4.5" fill="#1f242b"/>
    <text x="740" y="102" text-anchor="middle" fill="#e5e7eb" font-size="14" font-weight="600">Pronta</text>
    <circle cx="740" cy="160" r="36" fill="none" stroke="#33383f" stroke-width="6"/>
    <circle cx="740" cy="160" r="36" fill="none" stroke="#e5484d" stroke-width="6" stroke-dasharray="150 76" stroke-linecap="round" transform="rotate(-90 740 160)"/>
    <text x="740" y="167" text-anchor="middle" fill="#f3f4f6" font-size="21" font-weight="300">10:00</text>
    <rect x="665" y="104" width="150" height="112" rx="8" fill="#e5484d" fill-opacity="0.07" stroke="#e5484d" stroke-width="2"/>
    <rect x="659" y="94" width="34" height="17" rx="5" fill="#f59e0b"/>
    <text x="664" y="106" fill="#111" font-size="9.5" font-weight="700">div</text>
    <g filter="url(#soft)">
      <rect x="812" y="88" width="146" height="122" rx="10" fill="#16181d" stroke="#33383f"/>
      <rect x="820" y="96" width="40" height="15" rx="4" fill="#2a2f36"/>
      <text x="825" y="107" fill="#9ca3af" font-size="8.5" font-family="ui-monospace, monospace">&lt;div&gt;</text>
      <text x="866" y="107" fill="#6b7280" font-size="7">attaches to the session chat</text>
      <text x="946" y="107" fill="#9ca3af" font-size="9">✕</text>
      <rect x="820" y="118" width="130" height="46" rx="6" fill="#101214" stroke="#2a2f36"/>
      <text x="826" y="133" fill="#f3f4f6" font-size="9">adicione um efeito</text>
      <text x="826" y="145" fill="#f3f4f6" font-size="9">nos arcos/círculos</text>
      <rect x="892" y="138" width="1.5" height="10" fill="#e5e7eb">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
      </rect>
      <rect x="820" y="170" width="24" height="18" rx="5" fill="#1f242b" stroke="#33383f"/>
      <rect x="826" y="176" width="12" height="8" rx="2" fill="none" stroke="#9ca3af"/>
      <circle cx="832" cy="180" r="2.5" fill="none" stroke="#9ca3af"/>
      <circle cx="934" cy="179" r="12" fill="#e5484d"/>
      <path d="M934 174v8M930.5 177.5l3.5 -3.5 3.5 3.5" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    </g>
  </g>
  <text x="740" y="344" text-anchor="middle" fill="#9ca3af" font-size="12">2 · Comment or adjust live <tspan fill="#6b7280">— every change previews instantly</tspan></text>

  <g>
    <rect x="30" y="370" width="460" height="280" rx="10" fill="#0d0f12" stroke="#262b31"/>
    <text x="60" y="404" fill="#9ca3af" font-size="11">⚙ Analisando a solicitação</text>
    <text x="60" y="428" fill="#6b7280" font-size="11">🌿 Analisando a fundo há 27s <tspan><animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/></tspan>…</text>
    <g filter="url(#soft)">
      <rect x="130" y="452" width="260" height="34" rx="17" fill="#1f242b" stroke="#33383f"/>
      <circle cx="150" cy="469" r="7" fill="none" stroke="#9ca3af"/>
      <path d="M150 465v8M146 469h8" stroke="#9ca3af" stroke-linecap="round"/>
      <text x="166" y="473" fill="#e5e7eb" font-size="11" font-weight="600">1 web element</text>
      <rect x="266" y="459" width="52" height="20" rx="10" fill="#e5484d"/>
      <text x="292" y="473" text-anchor="middle" fill="#fff" font-size="10" font-weight="600">Send</text>
      <text x="338" y="473" fill="#9ca3af" font-size="11">✕</text>
    </g>
    <rect x="60" y="505" width="400" height="66" rx="16" fill="#16181d" stroke="#33383f"/>
    <text x="78" y="530" fill="#6b7280" font-size="10">Envie uma mensagem ou execute uma tarefa, / comandos, @ arquivos ou sessões</text>
    <circle cx="86" cy="552" r="8" fill="none" stroke="#6b7280"/>
    <path d="M86 548v8M82 552h8" stroke="#6b7280" stroke-linecap="round"/>
    <text x="104" y="556" fill="#9ca3af" font-size="9.5">🛡 Acesso total ▾</text>
    <text x="290" y="556" fill="#6b7280" font-size="9.5">M3.1-Flash · MiniMax Code (Global) Max ▾</text>
    <circle cx="440" cy="552" r="11" fill="#2a2f36"/>
    <path d="M440 547v9M436 552.5l4 -4.5 4 4.5" stroke="#9ca3af" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.55;0.62;1" dur="6s" repeatCount="indefinite"/>
      <rect x="60" y="470" width="120" height="20" rx="6" fill="#152012" stroke="#22c55e"/>
      <text x="120" y="484" text-anchor="middle" fill="#22c55e" font-size="9">card sent ✓</text>
    </g>
  </g>
  <text x="260" y="674" text-anchor="middle" fill="#9ca3af" font-size="12">3 · Confirm — the card waits at the composer</text>

  <g>
    <rect x="510" y="370" width="460" height="280" rx="10" fill="#0d0f12" stroke="#262b31"/>
    <g filter="url(#soft)">
      <rect x="556" y="396" width="304" height="126" rx="14" fill="#1e2227" stroke="#33383f"/>
      <circle cx="574" cy="414" r="6" fill="none" stroke="#9ca3af"/>
      <path d="M571 411a4.4 4.4 0 1 0 6 0M574 417v4" stroke="#9ca3af" stroke-linecap="round" fill="none"/>
      <text x="586" y="418" fill="#e5e7eb" font-size="10" font-weight="700"># Browser comments (Redline)</text>
      <text x="746" y="418" fill="#9ca3af" font-size="10">— 1 comment</text>
      <rect x="568" y="430" width="86" height="56" rx="6" fill="#0c0c0e" stroke="#33383f"/>
      <text x="611" y="448" text-anchor="middle" fill="#e5e7eb" font-size="8" font-weight="600">Pronta</text>
      <circle cx="611" cy="466" r="14" fill="none" stroke="#e5484d" stroke-width="2.5"/>
      <text x="611" y="470" text-anchor="middle" fill="#f3f4f6" font-size="8">10:00</text>
      <circle cx="670" cy="440" r="9" fill="#e5484d"/>
      <text x="670" y="443.5" text-anchor="middle" fill="#fff" font-size="9" font-weight="700">1</text>
      <text x="686" y="440" fill="#f3f4f6" font-size="9.5" font-weight="600">adicione um efeito</text>
      <text x="686" y="452" fill="#f3f4f6" font-size="9.5" font-weight="600">nos arcos/círculos</text>
      <text x="686" y="466" fill="#6b7280" font-size="8" font-family="ui-monospace, monospace">&lt;div&gt; body main:nth-of-type(1) &gt;</text>
      <text x="686" y="476" fill="#6b7280" font-size="8" font-family="ui-monospace, monospace">section:nth-of-type(1) &gt; div…</text>
    </g>
    <rect x="700" y="532" width="238" height="42" rx="12" fill="#262b31"/>
    <text x="908" y="557" text-anchor="end" fill="#f3f4f6" font-size="10.5">Aplique as anotações da página.</text>
    <circle cx="952" cy="553" r="14" fill="#3f444c"/>
    <circle cx="949" cy="549" r="4" fill="#111"/><path d="M952 553c3 0 5 2 5 5h-10c0 -3 2 -5 5 -5" fill="#111"/>
    <text x="530" y="566" fill="#9ca3af" font-size="10.5">⚙ Analisando a solicitação</text>
    <text x="530" y="590" fill="#6b7280" font-size="10.5">🌿 Analisando a fundo há 27s <tspan><animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/></tspan>…</text>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.55;0.62;0.94;1" dur="7s" repeatCount="indefinite"/>
      <rect x="530" y="606" width="180" height="20" rx="6" fill="#152012" stroke="#22c55e"/>
      <text x="620" y="620" text-anchor="middle" fill="#22c55e" font-size="9">arcs/circles effect added ✓</text>
    </g>
  </g>
  <text x="740" y="674" text-anchor="middle" fill="#9ca3af" font-size="12">4 · Send — the agent applies it to the source</text>
</svg>
